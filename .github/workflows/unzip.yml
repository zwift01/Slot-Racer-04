
name: Unzip Slot Racing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: ZIP entpacken
        run: |
          ZIP="Slot-Racing-v0.4-Kamera-Fix.zip"
          mkdir -p /tmp/slot-racing
          unzip -oq "$ZIP" -d /tmp/slot-racing

          ROOT="/tmp/slot-racing/slot-racing-pwa-development"
          test -f "$ROOT/package.json"

          cp -a "$ROOT"/. .

          rm -f .github/workflows/deploy.yml
          rm -f "$ZIP"

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install Slot Racing V0.4 with camera fix"
          fi

          git pull --rebase origin main
          git push origin HEAD:main
